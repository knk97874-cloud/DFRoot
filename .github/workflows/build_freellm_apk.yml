name: Build FreeLLM SuperPro APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FreeLLM SuperPro Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreeLLM App Branch
        uses: actions/checkout@v4
        with:
          ref: freellm-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Gradle
        working-directory: freellm_superpro
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk_output
          find freellm_superpro/app/build/outputs/apk/debug -name "*.apk" -exec cp {} apk_output/FreeLLM_SuperPro_v1.0.2.apk \;
          ls -la apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM_SuperPro_v1.0.2_APK
          path: apk_output/FreeLLM_SuperPro_v1.0.2.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: freellm-v1.0.2
          name: "FreeLLM SuperPro AI v1.0.2 (Native Android APK)"
          body: |
            ### 🚀 FreeLLM SuperPro AI v1.0.2 (Native Android App)
            - **Package**: `com.freellm.superpro`
            - **Fatal Crash Fix**: Fixed instant crash when clicking Send button (⬆️)
            - **Database Fix**: Resolved SQLite FOREIGN KEY constraint error (code 787) on new conversations
            - **Room DB Migration**: Bumped Room schema to v2 with fallbackToDestructiveMigration
            - **Coroutine Hardening**: Added CoroutineExceptionHandler & IO Dispatcher isolation
            - **UI Stability**: Hardened Jetpack Compose LazyColumn keys with indexed message mapping
            - **Ready for 1-Tap Install via MT Manager Canary (`bin.mt.plus.canary`)**
          files: apk_output/FreeLLM_SuperPro_v1.0.2.apk
          draft: false
          prerelease: false
