name: Local Redirect Auth Validation

on:
  workflow_dispatch:

permissions: {}

jobs:
  redirect-auth-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uname -a

      - name: Create self-contained localhost test harness
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-redirect-test.mjs" <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const packageJson = JSON.parse(
            fs.readFileSync(path.resolve('node_modules/@actions/http-client/package.json'), 'utf8')
          );
          const testedVersion = packageJson.version;
          const expectedVersion = process.env.EXPECTED_HTTP_CLIENT_VERSION;
          if (testedVersion !== expectedVersion) {
            throw new Error(`Version mismatch: expected ${expectedVersion}, found ${testedVersion}`);
          }

          const clientNamespace = await import('@actions/http-client');
          const HttpClient = clientNamespace.HttpClient ?? clientNamespace.default?.HttpClient;
          if (!HttpClient) throw new Error('HttpClient export was not found');

          // Support both v4.x (lib/auth.js) and v1.x (auth.js)
          const candidateAuthPaths = [
            path.resolve('node_modules/@actions/http-client/lib/auth.js'),
            path.resolve('node_modules/@actions/http-client/auth.js')
          ];
          const authPath = candidateAuthPaths.find(p => fs.existsSync(p));
          if (!authPath) throw new Error(`auth.js export not found in: ${candidateAuthPaths.join(', ')}`);

          const authNamespace = await import(pathToFileURL(authPath).href);
          const BearerCredentialHandler = authNamespace.BearerCredentialHandler ?? authNamespace.default?.BearerCredentialHandler;
          if (!BearerCredentialHandler) throw new Error('BearerCredentialHandler export was not found');

          const captures = [];
          const record = (server, req) => captures.push({
            server, url: req.url, method: req.method, headers: req.headers
          });
          const listen = (server, host) => new Promise((resolve, reject) => {
            server.once('error', reject);
            server.listen(0, host, () => {
              server.off('error', reject);
              resolve(server.address().port);
            });
          });
          const close = server => new Promise(resolve => {
            server.close(resolve);
            server.closeAllConnections?.();
          });

          const serverB = http.createServer((req, res) => {
            record('destination-B', req);
            res.writeHead(200, { 'content-type': 'application/json' });
            res.end(JSON.stringify({ ok: true }));
          });
          const portB = await listen(serverB, '127.0.0.2');

          const serverA = http.createServer((req, res) => {
            record('redirector-A', req);
            const status = req.url.endsWith('307') ? 307 : 302;
            res.writeHead(status, {
              location: `http://127.0.0.2:${portB}/sink${req.url}`,
              connection: 'close'
            });
            res.end();
          });
          const portA = await listen(serverA, '127.0.0.1');

          const canaryBearer = `canary-token-${testedVersion}-not-a-real-secret`;
          const rawHeader = `Bearer raw-canary-${testedVersion}-not-a-real-secret`;
          const results = [];

          async function requestCase(label, pathName, handlers, headers, expectedAuth) {
            const client = new HttpClient('local-redirect-auth-test', handlers);
            const response = await client.get(`http://127.0.0.1:${portA}/${pathName}`, headers);
            const body = await response.readBody();
            const destination = captures.find(r =>
              r.server === 'destination-B' && r.url === `/sink/${pathName}`
            );
            if (response.message.statusCode !== 200) {
              throw new Error(`${label}: final status was ${response.message.statusCode}; body=${body}`);
            }
            if (!destination) throw new Error(`${label}: destination request was not captured`);
            const actualAuth = destination.headers.authorization ?? null;
            results.push({
              test: label,
              destinationAuthorization: actualAuth,
              expectedAuthorization: expectedAuth,
              matchesExpectation: actualAuth === expectedAuth
            });
          }

          try {
            await requestCase(
              'Bearer handler via 302', 'bearer-302',
              [new BearerCredentialHandler(canaryBearer)], undefined,
              `Bearer ${canaryBearer}`
            );
            await requestCase(
              'Bearer handler via 307', 'bearer-307',
              [new BearerCredentialHandler(canaryBearer)], undefined,
              `Bearer ${canaryBearer}`
            );
            await requestCase(
              'Raw caller Authorization via 302 (negative control)', 'raw-302',
              [], { Authorization: rawHeader }, null
            );

            const bearer302 = results.find(r => r.test === 'Bearer handler via 302');
            const bearer307 = results.find(r => r.test === 'Bearer handler via 307');
            const raw302 = results.find(r => r.test.startsWith('Raw caller Authorization'));
            const reproduced = bearer302.matchesExpectation &&
              bearer307.matchesExpectation && raw302.matchesExpectation;

            console.log('=== RUNTIME TEST SUMMARY ===');
            console.log(JSON.stringify({
              package: '@actions/http-client',
              version: testedVersion,
              expectedVersion,
              originHost: '127.0.0.1',
              destinationHost: '127.0.0.2',
              verdict: reproduced
                ? 'CREDENTIAL-HANDLER REATTACHMENT REPRODUCED'
                : 'HYPOTHESIS NOT REPRODUCED AS EXPECTED',
              results,
              allCapturedRequestsAndHeaders: captures
            }, null, 2));
            console.log('=== END RUNTIME TEST SUMMARY ===');
          } finally {
            await Promise.all([close(serverA), close(serverB)]);
          }
          EOF

      - name: Install and test @actions/http-client 1.0.8 (isolated)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-v1"
          cd "$RUNNER_TEMP/test-v1"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @actions/http-client@1.0.8
          EXPECTED_HTTP_CLIENT_VERSION=1.0.8 node --input-type=module -e "const p=JSON.parse(await (await import('node:fs/promises')).readFile('node_modules/@actions/http-client/package.json','utf8')); if(p.version!=='1.0.8') process.exit(1); console.log('Verified installed package version:',p.version)"
          cp "$RUNNER_TEMP/run-redirect-test.mjs" ./run-redirect-test.mjs
          EXPECTED_HTTP_CLIENT_VERSION=1.0.8 node ./run-redirect-test.mjs

      - name: Install and test @actions/http-client 4.0.1 (isolated)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-v4"
          cd "$RUNNER_TEMP/test-v4"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @actions/http-client@4.0.1
          EXPECTED_HTTP_CLIENT_VERSION=4.0.1 node --input-type=module -e "const p=JSON.parse(await (await import('node:fs/promises')).readFile('node_modules/@actions/http-client/package.json','utf8')); if(p.version!=='4.0.1') process.exit(1); console.log('Verified installed package version:',p.version)"
          cp "$RUNNER_TEMP/run-redirect-test.mjs" ./run-redirect-test.mjs
          EXPECTED_HTTP_CLIENT_VERSION=4.0.1 node ./run-redirect-test.mjs
