name: Build

on:
  push:
    branches: [master, main, 'feature/*']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        run: |
          echo "Release keystore present."

      - name: Create signing.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        run: |
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          echo KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD >> signing.properties
          echo KEY_ALIAS=$KEY_ALIAS >> signing.properties
          echo KEY_PASSWORD=$KEY_PASSWORD >> signing.properties
          echo $KEYSTORE | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Stage verified dual ksud binaries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # 1. Standard KernelSU ksud v3.3.1
          curl -sSL "https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-aarch64-linux-android" -o app/src/main/jniLibs/arm64-v8a/libksud_standard.so
          EXPECTED_SHA_STANDARD="049491e2b4cc0a6c913d3920cb90b8c94c9e8ca96c0ee92818293304973bfb1b"
          echo "$EXPECTED_SHA_STANDARD  app/src/main/jniLibs/arm64-v8a/libksud_standard.so" | sha256sum -c -
          PRE_SHA_STANDARD=$(sha256sum app/src/main/jniLibs/arm64-v8a/libksud_standard.so | awk '{print $1}')
          echo "PRE_SHA_STANDARD=$PRE_SHA_STANDARD" >> $GITHUB_ENV
          echo "Pre-packaging Standard ksud SHA-256: $PRE_SHA_STANDARD"

          # 2. Samsung KernelSU ksud samsung-v2.2
          curl -sSL "https://github.com/diabl0w/KernelSU/releases/download/samsung-v2.2/ksud-aarch64-linux-android" -o app/src/main/jniLibs/arm64-v8a/libksud_samsung.so
          EXPECTED_SHA_SAMSUNG="3934878b5d01ab9f1dfdadbbb67505c7524090de1574719308211b26f0988f72"
          echo "$EXPECTED_SHA_SAMSUNG  app/src/main/jniLibs/arm64-v8a/libksud_samsung.so" | sha256sum -c -
          PRE_SHA_SAMSUNG=$(sha256sum app/src/main/jniLibs/arm64-v8a/libksud_samsung.so | awk '{print $1}')
          echo "PRE_SHA_SAMSUNG=$PRE_SHA_SAMSUNG" >> $GITHUB_ENV
          echo "Pre-packaging Samsung ksud SHA-256: $PRE_SHA_SAMSUNG"

          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build DFRoot APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ "$KEYSTORE" = "" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Building debug APK..."
            ./gradlew :app:assembleDebug
          else
            echo "Building release APK..."
            ./gradlew :app:assembleRelease
          fi

      - name: Verify dual ksud SHA-256 in packaged APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/DFRoot_*.apk 2>/dev/null || ls app/build/outputs/apk/release/DFRoot_*.apk)
          echo "Found APK: $APK"
          
          # Inspect zip headers for both files
          unzip -v "$APK" lib/arm64-v8a/libksud_standard.so
          unzip -v "$APK" lib/arm64-v8a/libksud_samsung.so
          
          # Extract and check Standard ksud
          POST_SHA_STANDARD=$(unzip -p "$APK" lib/arm64-v8a/libksud_standard.so | sha256sum | awk '{print $1}')
          echo "Standard Pre-packaging SHA-256:  $PRE_SHA_STANDARD"
          echo "Standard Post-packaging SHA-256: $POST_SHA_STANDARD"
          EXPECTED_SHA_STANDARD="049491e2b4cc0a6c913d3920cb90b8c94c9e8ca96c0ee92818293304973bfb1b"
          if [ "$POST_SHA_STANDARD" != "$EXPECTED_SHA_STANDARD" ]; then
            echo "ERROR: Standard ksud SHA-256 mismatch! Expected $EXPECTED_SHA_STANDARD but got $POST_SHA_STANDARD"
            exit 1
          fi
          
          # Extract and check Samsung ksud
          POST_SHA_SAMSUNG=$(unzip -p "$APK" lib/arm64-v8a/libksud_samsung.so | sha256sum | awk '{print $1}')
          echo "Samsung Pre-packaging SHA-256:  $PRE_SHA_SAMSUNG"
          echo "Samsung Post-packaging SHA-256: $POST_SHA_SAMSUNG"
          EXPECTED_SHA_SAMSUNG="3934878b5d01ab9f1dfdadbbb67505c7524090de1574719308211b26f0988f72"
          if [ "$POST_SHA_SAMSUNG" != "$EXPECTED_SHA_SAMSUNG" ]; then
            echo "ERROR: Samsung ksud SHA-256 mismatch! Expected $EXPECTED_SHA_SAMSUNG but got $POST_SHA_SAMSUNG"
            exit 1
          fi
          
          echo "SUCCESS: Both Standard and Samsung ksud binaries preserved bit-for-bit in APK with keepDebugSymbols!"

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
