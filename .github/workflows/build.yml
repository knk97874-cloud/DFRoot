name: Build

on:
  push:
    branches: [master, main, 'feature/*']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        run: |
          echo "Release keystore present."

      - name: Create signing.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        run: |
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          echo KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD >> signing.properties
          echo KEY_ALIAS=$KEY_ALIAS >> signing.properties
          echo KEY_PASSWORD=$KEY_PASSWORD >> signing.properties
          echo $KEYSTORE | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Stage verified libksud.so into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sSL "https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-aarch64-linux-android" -o app/src/main/jniLibs/arm64-v8a/libksud.so
          EXPECTED_SHA="049491e2b4cc0a6c913d3920cb90b8c94c9e8ca96c0ee92818293304973bfb1b"
          echo "$EXPECTED_SHA  app/src/main/jniLibs/arm64-v8a/libksud.so" | sha256sum -c -
          PRE_SHA=$(sha256sum app/src/main/jniLibs/arm64-v8a/libksud.so | awk '{print $1}')
          echo "PRE_SHA=$PRE_SHA" >> $GITHUB_ENV
          echo "Pre-packaging libksud.so SHA-256: $PRE_SHA"
          ls -l app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build DFRoot APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ "$KEYSTORE" = "" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Building debug APK..."
            ./gradlew :app:assembleDebug
          else
            echo "Building release APK..."
            ./gradlew :app:assembleRelease
          fi

      - name: Verify libksud.so SHA-256 in packaged APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/DFRoot_*.apk 2>/dev/null || ls app/build/outputs/apk/release/DFRoot_*.apk)
          echo "Found APK: $APK"
          unzip -v "$APK" lib/arm64-v8a/libksud.so
          POST_SHA=$(unzip -p "$APK" lib/arm64-v8a/libksud.so | sha256sum | awk '{print $1}')
          echo "Pre-packaging SHA-256:  $PRE_SHA"
          echo "Post-packaging SHA-256: $POST_SHA"
          EXPECTED_SHA="049491e2b4cc0a6c913d3920cb90b8c94c9e8ca96c0ee92818293304973bfb1b"
          if [ "$POST_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: SHA-256 mismatch! Expected $EXPECTED_SHA but got $POST_SHA"
            exit 1
          fi
          echo "SUCCESS: libksud.so preserved bit-for-bit in APK with keepDebugSymbols!"

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
